services:
  db:
    image: postgres:16-alpine
    container_name: favorite-places-db-compose
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    container_name: favorite-places-server-compose
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: supersecret
      DB_NAME: postgres
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
    container_name: favorite-places-client-compose
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server