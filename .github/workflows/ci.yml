name: CI - Build and Test MFP

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Run server tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

  build-and-push-server:
    name: Build and push server Docker image
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build server image
        run: docker build -t ghcr.io/${{ github.repository }}-server:latest ./server

      - name: Push server image
        run: docker push ghcr.io/${{ github.repository }}-server:latest

  build-and-push-client:
    name: Build and push client Docker image
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build client image
        run: docker build -t ghcr.io/${{ github.repository }}-client:latest ./client

      - name: Push client image
        run: docker push ghcr.io/${{ github.repository }}-client:latest